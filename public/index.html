<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OSHOIC — The Osho Discourses Collection</title>
  <meta name="description" content="OSHOIC — a quiet listening room for the collected discourses of Osho. Every teaching, Hindi & English. Gathered and kept by ifallertzia.">
  <meta property="og:title" content="OSHOIC — The Osho Discourses Collection">
  <meta property="og:description" content="Every teaching, one quiet place. Thousands of lectures, Hindi & English.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#090714">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23090714'/%3E%3Cg fill='none' stroke='%23b8945c' stroke-width='2'%3E%3Cpath d='M32 44c-3.5-5.5-3.5-13 0-20 3.5 7 3.5 14.5 0 20z'/%3E%3Cpath d='M32 44c-7-1.8-12.5-7-14.5-14.5 7.2 0 12.8 4.6 14.5 14.5z'/%3E%3Cpath d='M32 44c7-1.8 12.5-7 14.5-14.5-7.2 0 12.8 4.6 14.5 14.5z'/%3E%3Cpath d='M20 48c7.5 3.5 16.5 3.5 24 0'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://archive.org">
  <link rel="preconnect" href="https://archive.org" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Manrope:wght@300;400;500;600;700;800&family=Noto+Serif+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <header class="site">
    <a class="logo" href="#/" aria-label="OSHOIC home">
      <span class="om">ॐ</span><b>OSHO</b><i>IC</i>
    </a>
    <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="nav-menu" aria-label="Menu">
      <span class="bar" aria-hidden="true"></span>
    </button>
    <nav class="main" id="nav-menu" aria-label="Primary">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/browse" data-nav="browse">Discourses</a>
      <a href="#/sadhana" data-nav="sadhana">Sadhana</a>
      <a href="#/about" data-nav="about">About</a>
    </nav>
    <span id="syncb-slot"></span>
  </header>

  <main id="view" aria-live="polite"></main>

  <footer class="site">
    <div class="flotus">✦ ॐ ✦</div>
    <p><b style="color:var(--gold2); letter-spacing:.12em;">OSHOIC</b> — a listening room for the collected discourses of Osho.</p>
    <p>Curated, crafted and kept alive by <b style="color:var(--gold2)">ifallertzia</b> — for personal spiritual study. May it serve your silence.</p>
  </footer>

  <div id="dock" role="region" aria-label="Audio player">
    <div class="dock-inner">
      <div class="dinfo">
        <div data-p="art" aria-hidden="true"></div>
        <div class="dmeta">
          <div data-p="title">Nothing playing</div>
          <div data-p="sub">OSHOIC · from ifallertzia</div>
        </div>
      </div>
      <div class="dcontrols">
        <button class="pbtn" data-p="prev" aria-label="Previous lecture">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M7 6h2.4v12H7zM17.5 6v12L9.8 12z"/></svg>
        </button>
        <button class="pbtn main" data-p="play" aria-label="Play / pause">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M8 5.5v13l11-6.5z"/></svg>
        </button>
        <button class="pbtn" data-p="next" aria-label="Next lecture">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M14.6 6H17v12h-2.4zM6.5 6v12l7.7-6z"/></svg>
        </button>
      </div>
      <div class="dseek">
        <span data-p="cur">0:00</span>
        <div class="seekwrap">
          <div class="rail"></div>
          <div class="buf" data-p="buf"></div>
          <input type="range" min="0" max="1000" value="0" data-p="seek" aria-label="Seek">
        </div>
        <span data-p="dur">0:00</span>
      </div>
      <div class="daux">
        <button class="dldbtn" data-p="download" title="Download this lecture" aria-label="Download this lecture">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 4v10m0 0l-4-4m4 4l4-4M5 19h14"/></svg>
        </button>
        <button class="speedbtn" data-p="speed" title="Playback speed">1×</button>
        <span class="volwrap" title="Volume">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9zM16.5 8.6a4.5 4.5 0 0 1 0 6.8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          <input class="vol" type="range" min="0" max="1" step="0.01" value="0.9" data-p="vol" aria-label="Volume">
        </span>
      </div>
    </div>

    <div class="dloverlay" data-p="dloverlay" aria-hidden="true" aria-label="Download progress">
      <div class="dlcard">
        <svg class="dlsvg" viewBox="0 0 46 46" aria-hidden="true">
          <circle class="dl-bg" cx="23" cy="23" r="19.5"/>
          <circle class="dl-ring" cx="23" cy="23" r="19.5"/>
        </svg>
        <span class="dl-pct" data-p="dlpct">0%</span>
        <button class="dl-close" data-p="dlclose" aria-label="Cancel download">✕</button>
      </div>
    </div>
  </div>

  <div id="toasts" aria-live="assertive"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
